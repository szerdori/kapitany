# Minden feltöltéskor lefuttatja a teszteket (alapréteg logikája + a felület láthatatlan böngészőben),
# és kiírja a lefedettséget. Ha a lefedettség a scripts/package.json-ben megadott küszöb alá esik, piros.
name: Tesztek

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tesztek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
