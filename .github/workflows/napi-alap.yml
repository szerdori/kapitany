# Naponta egyszer összegyűjti a hírcímeket és az inspirációs cikkeket (AI nélkül), és a Firestore-ba írja.
# 3:17 UTC = budapesti idő szerint télen 4:17, nyáron 5:17. Páratlan perc, mert a kerek perceken késik a legtöbbet.
# Délután még egyszer lefut, hogy a napközben érkező kártyák is bekerüljenek; a Claude-összefoglalót nem írja felül.
name: Napi alapréteg

on:
  schedule:
    - cron: '17 3 * * *'
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: napi-alap
  cancel-in-progress: false

jobs:
  alap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12.7.0 fast-xml-parser@4.5.0
      - run: node alap.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
